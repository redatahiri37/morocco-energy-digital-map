<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Solar — Mathematical Validation Tests</title>
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f5f7fa;
  padding: 20px;
  max-width: 1000px;
  margin: 0 auto;
  line-height: 1.6;
}
h1 {
  color: #001f4d;
  border-bottom: 3px solid #ff6b35;
  padding-bottom: 10px;
}
.test-result {
  background: white;
  padding: 15px;
  margin: 15px 0;
  border-radius: 4px;
  border-left: 4px solid #4caf50;
}
.test-result.error {
  border-left-color: #f44336;
}
.test-result.warning {
  border-left-color: #ff9800;
}
.test-result h3 {
  margin: 0 0 10px 0;
}
.test-result pre {
  background: #f5f5f5;
  padding: 10px;
  border-radius: 3px;
  overflow-x: auto;
  font-size: 12px;
}
.summary {
  background: white;
  padding: 20px;
  border-radius: 4px;
  margin: 20px 0;
  border: 2px solid #ff6b35;
  font-weight: bold;
}
.summary.pass {
  border-color: #4caf50;
  color: #4caf50;
}
.summary.fail {
  border-color: #f44336;
  color: #f44336;
}
button {
  background: #ff6b35;
  color: white;
  border: none;
  padding: 12px 24px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 16px;
}
button:hover {
  background: #e55a24;
}
</style>
</head>
<body>

<h1>📊 Atlas Solar — Mathematical Validation Tests</h1>
<p>This page runs the complete calculation chain through metamorphic tests to detect mathematical inconsistencies.</p>

<button onclick="runTests()">Run All Tests</button>

<div id="output"></div>

<script src="app.js"></script>
<script src="tests-math-validation.js"></script>

<script>
function runTests() {
  const output = document.getElementById("output");
  output.innerHTML = "<p>Running tests...</p>";

  // Capture console.log
  const logs = [];
  const originalLog = console.log;
  console.log = function(...args) {
    logs.push(args.join(" "));
    originalLog.apply(console, args);
  };

  // Run tests
  const passed = runAllTests();
  console.log = originalLog;

  // Render results
  let html = "<div class='summary " + (passed ? "pass" : "fail") + "'>";
  if (passed) {
    html += "✓ ALL TESTS PASSED";
  } else {
    html += "❌ TESTS FAILED — See errors below";
  }
  html += "</div>";

  // Format error/warning output
  if (MathTests.errors.length > 0 || MathTests.warnings.length > 0) {
    if (MathTests.errors.length > 0) {
      html += "<h2>❌ Errors (" + MathTests.errors.length + ")</h2>";
      MathTests.errors.forEach(e => {
        html += "<div class='test-result error'>";
        html += "<h3>" + escapeHtml(e.message) + "</h3>";
        if (e.details) {
          html += "<pre>" + escapeHtml(e.details) + "</pre>";
        }
        html += "</div>";
      });
    }

    if (MathTests.warnings.length > 0) {
      html += "<h2>⚠️  Warnings (" + MathTests.warnings.length + ")</h2>";
      MathTests.warnings.forEach(w => {
        html += "<div class='test-result warning'>";
        html += "<h3>" + escapeHtml(w.message) + "</h3>";
        if (w.details) {
          html += "<pre>" + escapeHtml(w.details) + "</pre>";
        }
        html += "</div>";
      });
    }
  }

  output.innerHTML = html;
}

function escapeHtml(text) {
  const map = {
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  };
  return String(text).replace(/[&<>"']/g, m => map[m]);
}

// Auto-run on page load
window.addEventListener("load", () => {
  document.querySelector("button").click();
});
</script>

</body>
</html>
