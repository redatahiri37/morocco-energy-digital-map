name = "solar-pvgis"
main = "worker.js"
compatibility_date = "2026-07-01"

# Workers Free plan is sufficient (100k req/day).
# Deployed by .github/workflows/worker.yml on every change to main
# (or "Run workflow"). By hand: `npx wrangler@4 deploy` from this directory.
# Logs: `wrangler tail`

# Per-IP rate limit used by env.RATE_LIMITER in worker.js (60 req/min, one
# bucket each for /pvcalc, /e and /csp). Keep this block: without it the worker
# falls back to a weaker per-isolate counter and logs
# "RATE_LIMITER binding missing" in `wrangler tail`. Needs wrangler 4.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

# Its own, much lower limit for the chat assistant (POST /chat, chat.js):
# each answer costs a model call. 10 answers per minute per IP.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 10
  period = 60

# Chat assistant (POST /chat, chat.js): an open model on Workers AI, inside
# the Workers Free plan's daily allowance (no card, no API key). It answers
# 503 until its access key is set:
#   npx wrangler@4 secret put CHAT_ACCESS_KEY --name solar-pvgis   (any long random string)
# The model is chat.js's DEFAULT_MODEL unless a [vars] CHAT_MODEL names another.
[ai]
binding = "AI"

# Usage analytics dataset written by POST /e (see ../ANALYTICS.md).
# Analytics Engine is included on the Workers Free plan. If `wrangler deploy`
# rejects this block, delete it — the worker degrades gracefully (events are
# accepted and dropped) when the binding is absent.
[[analytics_engine_datasets]]
binding = "SOLAR_ANALYTICS"
dataset = "solar_events"

# Content-Security-Policy violation reports written by POST /csp (see
# ../../SECURITY.md › "Reading the CSP reports"). Without this block the
# worker accepts the reports and drops them.
[[analytics_engine_datasets]]
binding = "CSP_REPORTS"
dataset = "solar_csp"
