name = "solar-pvgis"
main = "worker.js"
compatibility_date = "2026-07-01"

# Workers Free plan is sufficient (100k req/day).
# Deployed by .github/workflows/worker.yml on every change to main
# (or "Run workflow"). By hand: `npx wrangler@4 deploy` from this directory.
# Logs: `wrangler tail`

# Per-IP rate limit used by env.RATE_LIMITER in worker.js (60 req/min, one
# bucket for /pvcalc and one for /e). Keep this block: without it the worker
# falls back to a weaker per-isolate counter and logs
# "RATE_LIMITER binding missing" in `wrangler tail`. Needs wrangler 4.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

# Usage analytics dataset written by POST /e (see ../ANALYTICS.md).
# Analytics Engine is included on the Workers Free plan. If `wrangler deploy`
# rejects this block, delete it — the worker degrades gracefully (events are
# accepted and dropped) when the binding is absent.
[[analytics_engine_datasets]]
binding = "SOLAR_ANALYTICS"
dataset = "solar_events"
