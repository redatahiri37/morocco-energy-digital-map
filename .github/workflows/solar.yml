name: solar-deploy

on:
  push:
    branches: [main]
    paths: ['solar/**', '.github/workflows/solar.yml']
  pull_request:
    branches: [main]
    paths: ['solar/**', '.github/workflows/solar.yml']
  workflow_dispatch:   # "Run workflow" button: redeploy main without a code change

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check the page scripts
        run: |
          set -e
          node --check solar/app.js
          node --check solar/analytics.js

      - name: Worker tests
        working-directory: solar/proxy
        run: node worker.test.mjs

  # Publishes the estimator to the Cloudflare Pages project behind
  # solar.wattu.org (atlas-solar). Runs only on main, after the checks.
  # Same secrets as the map's deploy. The Worker in solar/proxy is not
  # deployed here (`wrangler deploy` from solar/proxy).
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy-atlas-solar
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Only what the page loads: keeps the Worker source, tests and notes
      # off the public site.
      - name: Stage the public files
        run: |
          set -e
          mkdir _site
          cp solar/index.html solar/app.js solar/analytics.js solar/style.css \
             solar/brand.css solar/robots.txt solar/sitemap.xml _site/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=atlas-solar --branch=main --commit-dirty=true
