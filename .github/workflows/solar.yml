name: solar-deploy

on:
  push:
    branches: [main]
    paths: ['solar/**', 'scripts/check-sri.mjs', 'docs/brand.css', 'docs/fonts/**', 'docs/*.svg', '.github/workflows/solar.yml']
  pull_request:
    branches: [main]
    paths: ['solar/**', 'scripts/check-sri.mjs', 'docs/brand.css', 'docs/fonts/**', 'docs/*.svg', '.github/workflows/solar.yml']
  workflow_dispatch:   # "Run workflow" button: redeploy main without a code change

# Read-only token for every job: deploys use the Cloudflare secrets, not
# the GitHub token.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Syntax-check the page scripts
        run: |
          set -e
          node --check solar/app.js
          node --check solar/analytics.js

      # Both Pages projects ship their own copy of the shared identity:
      # brand sheet, logo, favicon and fonts.
      - name: Shared identity files are the same in both apps
        run: |
          set -e
          cmp docs/brand.css solar/brand.css
          cmp docs/mark.svg solar/mark.svg
          cmp docs/favicon.svg solar/favicon.svg
          diff -r docs/fonts solar/fonts

      # No code from another site; vendored libraries match their hashes.
      - name: Page code is first-party and untampered
        run: node scripts/check-sri.mjs solar/index.html

      - name: Worker tests
        working-directory: solar/proxy
        run: node worker.test.mjs

  # Publishes the estimator to the Cloudflare Pages project behind
  # solar.wattu.org (atlas-solar). Runs only on main, after the checks.
  # Same secrets as the map's deploy. The Worker in solar/proxy is not
  # deployed here: worker.yml does it.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Cloudflare secrets live in the "production" environment, which only
    # main may use: a workflow pushed on any other branch cannot read them.
    environment:
      name: production
      url: https://solar.wattu.org
    concurrency:
      group: pages-deploy-atlas-solar
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Only what the page loads: keeps the Worker source, tests and notes
      # off the public site.
      - name: Stage the public files
        run: |
          set -e
          mkdir _site
          cp solar/index.html solar/app.js solar/analytics.js solar/style.css \
             solar/brand.css solar/mark.svg solar/favicon.svg \
             solar/robots.txt solar/sitemap.xml solar/_headers _site/
          cp -r solar/fonts _site/fonts
          cp -r solar/vendor _site/vendor
          cp -r solar/installers _site/installers
          # New asset URLs on every deploy: Cloudflare's browser cache would
          # otherwise serve the previous style.css / app.js with the new page.
          V="${GITHUB_SHA::8}"
          sed -i -E 's#((href|src)="(style\.css|brand\.css|app\.js|analytics\.js))"#\1?v='"$V"'"#g' _site/index.html
          test "$(grep -c "?v=$V" _site/index.html)" -eq 4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          wranglerVersion: "3.90.0"   # the version v3.15.0 installs by default, pinned
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=atlas-solar --branch=main --commit-dirty=true
