name: docs-validate

on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/*-countries.mjs', 'DATA_SCHEMA.md', '.github/workflows/validate.yml']
  pull_request:
    branches: [main]
    paths: ['docs/**', 'scripts/*-countries.mjs', 'DATA_SCHEMA.md', '.github/workflows/validate.yml']
  workflow_dispatch:   # "Run workflow" button: redeploy main without a code change

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check app.js and countries.config.js
        run: |
          set -e
          node --check docs/app.js
          node --check docs/countries.config.js

      # Every country in countries.config.js: config fields, referenced files,
      # GeoJSON against DATA_SCHEMA.md, coordinates inside the country bounds.
      - name: Validate countries and data
        run: node scripts/validate-countries.mjs

      # Reintroduces each defect the validator checks for and asserts it fails,
      # so a check can't be silently weakened.
      - name: Self-test the validator
        run: node scripts/test-validate-countries.mjs

  # Publishes docs/ to the Cloudflare Pages project behind energy.wattu.org
  # (atlas-nexus). Runs only on main, and only after validate passes.
  # Needs two repository secrets:
  #   CLOUDFLARE_API_TOKEN   — token with Account › Cloudflare Pages › Edit
  #   CLOUDFLARE_ACCOUNT_ID  — shown on the Cloudflare dashboard sidebar
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy-atlas-nexus
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy docs/ to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=atlas-nexus --branch=main --commit-dirty=true
