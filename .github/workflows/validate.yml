name: docs-validate

on:
  push:
    branches: [main]
    paths: ['docs/**', 'solar/brand.css', 'solar/fonts/**', 'solar/*.svg', 'scripts/*-countries.mjs', 'scripts/check-sri.mjs', 'DATA_SCHEMA.md', '.github/workflows/validate.yml']
  pull_request:
    branches: [main]
    paths: ['docs/**', 'solar/brand.css', 'solar/fonts/**', 'solar/*.svg', 'scripts/*-countries.mjs', 'scripts/check-sri.mjs', 'DATA_SCHEMA.md', '.github/workflows/validate.yml']
  workflow_dispatch:   # "Run workflow" button: redeploy main without a code change

# Read-only token for every job: deploys use the Cloudflare secrets, not
# the GitHub token.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Syntax-check app.js and countries.config.js
        run: |
          set -e
          node --check docs/app.js
          node --check docs/countries.config.js

      # Both Pages projects ship their own copy of the shared identity:
      # brand sheet, logo, favicon and fonts.
      - name: Shared identity files are the same in both apps
        run: |
          set -e
          cmp docs/brand.css solar/brand.css
          cmp docs/mark.svg solar/mark.svg
          cmp docs/favicon.svg solar/favicon.svg
          diff -r docs/fonts solar/fonts

      # No code from another site; vendored libraries match their hashes.
      - name: Page code is first-party and untampered
        run: node scripts/check-sri.mjs docs/index.html

      # docs/_headers allows the inline redirect script in index.html by its
      # hash. Edit the script without updating the hash and the browser
      # silently refuses it, so CI checks they agree.
      - name: CSP hash matches the inline script
        run: |
          set -e
          H=$(node -e 'const s=require("fs").readFileSync("docs/index.html","utf8");const m=s.match(/<script>([\s\S]*?)<\/script>/);process.stdout.write(require("crypto").createHash("sha256").update(m[1]).digest("base64"))')
          grep -qF "'sha256-$H'" docs/_headers || { echo "docs/_headers needs 'sha256-$H'"; exit 1; }

      # Every country in countries.config.js: config fields, referenced files,
      # GeoJSON against DATA_SCHEMA.md, coordinates inside the country bounds.
      - name: Validate countries and data
        run: node scripts/validate-countries.mjs

      # Reintroduces each defect the validator checks for and asserts it fails,
      # so a check can't be silently weakened.
      - name: Self-test the validator
        run: node scripts/test-validate-countries.mjs

  # Publishes docs/ to the Cloudflare Pages project behind energy.wattu.org
  # (atlas-nexus). Runs only on main, and only after validate passes.
  # Needs two secrets in the "production" environment (see SECURITY.md):
  #   CLOUDFLARE_API_TOKEN   — Account › Cloudflare Pages › Edit and
  #                            Account › Workers Scripts › Edit
  #   CLOUDFLARE_ACCOUNT_ID  — shown on the Cloudflare dashboard sidebar
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Cloudflare secrets live in the "production" environment, which only
    # main may use: a workflow pushed on any other branch cannot read them.
    environment:
      name: production
      url: https://energy.wattu.org
    concurrency:
      group: pages-deploy-atlas-nexus
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Cloudflare's browser cache keeps style.css / app.js for hours, so a
      # phone got the new index.html with the old stylesheet. A per-deploy
      # ?v= query gives every asset a new URL on each deploy.
      - name: Version the asset URLs
        run: |
          set -e
          V="${GITHUB_SHA::8}"
          sed -i -E 's#((href|src)="\./(style\.css|brand\.css|app\.js|countries\.config\.js))"#\1?v='"$V"'"#g' docs/index.html
          test "$(grep -c "?v=$V" docs/index.html)" -eq 4

      - name: Deploy docs/ to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          wranglerVersion: "3.90.0"   # the version v3.15.0 installs by default, pinned
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=atlas-nexus --branch=main --commit-dirty=true
