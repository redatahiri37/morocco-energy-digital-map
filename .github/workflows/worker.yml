name: worker-deploy

# Deploys the solar-pvgis Worker (solar/proxy) when it changes on main, after
# its tests pass. "Run workflow" redeploys it by hand, from a phone too.
# Uses the same secrets as the Pages deploys; the API token needs
# Account › Workers Scripts › Edit in addition to Cloudflare Pages › Edit.
on:
  push:
    branches: [main]
    paths: ['solar/proxy/**', '.github/workflows/worker.yml']
  pull_request:
    branches: [main]
    paths: ['solar/proxy/**', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Worker tests
        working-directory: solar/proxy
        run: node worker.test.mjs

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Cloudflare secrets live in the "production" environment, which only
    # main may use: a workflow pushed on any other branch cannot read them.
    environment:
      name: production
      url: https://solar-pvgis.redatahiri.workers.dev
    concurrency:
      group: worker-deploy-solar-pvgis
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          wranglerVersion: "4.147.0"   # [[ratelimits]] in wrangler.toml needs wrangler 4
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: solar/proxy
          command: deploy
