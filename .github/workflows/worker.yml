name: worker-deploy

# Deploys the solar-pvgis Worker (solar/proxy) when it changes on main, after
# its tests pass. "Run workflow" redeploys it by hand, from a phone too.
# Uses the same secrets as the Pages deploys; the API token needs
# Account › Workers Scripts › Edit in addition to Cloudflare Pages › Edit.
on:
  push:
    branches: [main]
    paths: ['solar/proxy/**', 'solar/engine.js', 'solar/data/cities.json', '.github/workflows/worker.yml']
  pull_request:
    branches: [main]
    paths: ['solar/proxy/**', 'solar/engine.js', 'solar/data/cities.json', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Worker tests
        working-directory: solar/proxy
        run: |
          set -e
          npm ci --ignore-scripts --no-audit --no-fund
          node worker.test.mjs
          node chat.test.mjs

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Named so the Cloudflare secrets can move to the "production"
    # environment, readable from main only. Until they do (SECURITY.md,
    # accepted risk) they are repository secrets, which a workflow pushed
    # on any branch can read.
    environment:
      name: production
      url: https://solar-pvgis.redatahiri.workers.dev
    concurrency:
      group: worker-deploy-solar-pvgis
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The bundle takes the Anthropic SDK from node_modules (chat.js) and
      # ../engine.js and ../data/cities.json from the checkout.
      - name: Install the pinned dependencies
        working-directory: solar/proxy
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          wranglerVersion: "4.147.0"   # [[ratelimits]] needs wrangler 4; same pin in solar.yml and validate.yml
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: solar/proxy
          command: deploy
