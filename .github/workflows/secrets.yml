name: secret-scan

# Every push and PR is scanned for credentials, whatever hooks the clone
# that made it had installed. gitleaks is downloaded at a fixed version and
# its checksum checked; history pushed in the PR or push is scanned.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.30.1
        run: |
          set -e
          V=8.30.1
          curl -sSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks && rm gl.tgz

      - name: Scan
        run: ./gitleaks git --no-banner --redact --exit-code 1 .
